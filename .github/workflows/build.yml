name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o -q khazinati.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      - name: Build
        working-directory: khazinati
        run: |
          flutter create --platforms=android --org com.khazinati --project-name khazinati .
          flutter pub get
          dart run tool/setup_android.dart
          dart run flutter_launcher_icons
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: khazinati-apk
          path: khazinati/build/app/outputs/flutter-apk/app-release.apk
